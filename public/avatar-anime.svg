<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="二次元头像">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd6e8"/>
      <stop offset="100%" stop-color="#d4e6ff"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a63d2"/>
      <stop offset="100%" stop-color="#5f3ea8"/>
    </linearGradient>
    <linearGradient id="irisG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#5a4fcf"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <circle cx="128" cy="128" r="128" fill="url(#bgG)"/>
  <!-- 星星点缀 -->
  <path d="M205 62 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" fill="#fff" opacity="0.7"/>
  <path d="M52 78 l2.5 5.5 5.5 2.5 -5.5 2.5 -2.5 5.5 -2.5 -5.5 -5.5 -2.5 5.5 -2.5 z" fill="#fff" opacity="0.55"/>
  <circle cx="212" cy="182" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="46" cy="176" r="2.2" fill="#fff" opacity="0.45"/>

  <!-- 肩膀 -->
  <path d="M88 250 Q100 208 128 208 Q156 208 168 250 Z" fill="#b98ce0" opacity="0.5"/>

  <!-- 头发(后层) -->
  <path d="M66 128 Q58 66 128 56 Q198 66 190 128 L188 190 Q128 205 68 190 Z" fill="#5f3ea8"/>

  <!-- 脸 -->
  <circle cx="128" cy="142" r="60" fill="#ffe3d3"/>

  <!-- 刘海 -->
  <path d="M68 118 Q70 72 128 70 Q186 72 188 118
           Q172 92 152 98 Q142 86 128 92 Q114 86 104 98 Q84 92 68 118 Z"
        fill="url(#hairG)"/>
  <!-- 两侧发丝 -->
  <path d="M70 120 Q60 160 66 200 Q72 200 76 176 Q74 150 84 128 Z" fill="url(#hairG)"/>
  <path d="M186 120 Q196 160 190 200 Q184 200 180 176 Q182 150 172 128 Z" fill="url(#hairG)"/>

  <!-- 呆毛 -->
  <path d="M128 62 Q132 44 148 40 Q136 48 134 62 Z" fill="url(#hairG)"/>

  <!-- 眼睛 -->
  <g>
    <ellipse cx="102" cy="148" rx="15" ry="18" fill="#fff"/>
    <ellipse cx="154" cy="148" rx="15" ry="18" fill="#fff"/>
    <ellipse cx="102" cy="150" rx="12" ry="15" fill="url(#irisG)"/>
    <ellipse cx="154" cy="150" rx="12" ry="15" fill="url(#irisG)"/>
    <circle cx="98" cy="145" r="4.5" fill="#fff"/>
    <circle cx="150" cy="145" r="4.5" fill="#fff"/>
    <circle cx="106" cy="154" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="158" cy="154" r="2" fill="#fff" opacity="0.8"/>
    <path d="M88 140 Q102 130 116 140" stroke="#4a3b6b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M140 140 Q154 130 168 140" stroke="#4a3b6b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M92 158 Q102 162 112 158" stroke="#4a3b6b" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M144 158 Q154 162 164 158" stroke="#4a3b6b" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 眉毛 -->
  <path d="M92 128 Q102 123 114 127" stroke="#6b4f9e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M142 127 Q154 123 164 128" stroke="#6b4f9e" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 腮红 -->
  <ellipse cx="88" cy="164" rx="10" ry="6" fill="#ff9eb5" opacity="0.5"/>
  <ellipse cx="168" cy="164" rx="10" ry="6" fill="#ff9eb5" opacity="0.5"/>

  <!-- 嘴巴 -->
  <path d="M120 168 Q128 175 136 168" stroke="#d96a7e" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- 发饰星星 -->
  <path d="M172 84 l4.5 9 9 4.5 -9 4.5 -4.5 9 -4.5 -9 -9 -4.5 9 -4.5 z" fill="#ffd76e" stroke="#fff" stroke-width="1.5"/>
</svg>
