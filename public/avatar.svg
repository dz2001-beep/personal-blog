<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="头像">
  <defs>
    <linearGradient id="avatarGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="256" height="256" fill="#161b22"/>
  <!-- 外圈 -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="url(#avatarGradient)" stroke-width="10"/>
  <!-- 代码符号 </> -->
  <text x="128" y="140" font-family="Menlo, Consolas, monospace" font-size="76" font-weight="700"
        fill="url(#avatarGradient)" text-anchor="middle">&lt;/&gt;</text>
  <!-- 光标闪烁点(装饰) -->
  <rect x="128" y="176" width="4" height="26" rx="2" fill="#9ece6a"/>
</svg>
